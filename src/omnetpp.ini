[General]
# UAV swarm task allocation -- ideal in-range communication, custom mobility.
network = uavswarmta.SwarmNetwork

# ---- Apps installed in each host ---------------------------------------
*.mainNode.numApps = 1
*.mainNode.app[0].typename = "uavswarmta.MainNodeApp"

*.mbs[*].numApps = 1
*.mbs[*].app[0].typename = "uavswarmta.MbsApp"

*.drone[*].numApps = 1
*.drone[*].app[0].typename = "uavswarmta.DroneApp"

# ---- Reproducibility & batch ------------------------------------------
repeat = 5
seed-set = ${repetition}

# Visual feedback (canvas-only INET build)
*.visualizer.osgVisualizer.typename = ""

# Stop simulation eventually
sim-time-limit = 100000s

# ---- App parameters ---------------------------------------------------
**.commTimeoutDuration = 10s
**.taskLimit = 50
**.drone_comm_range = 250m
**.mbs_comm_range = 800m

*.mainNode.app[0].algorithmType = "FIFO"
*.mainNode.app[0].taskLimit = 50
*.mainNode.app[0].taskGenerationInterval = uniform(10s, 30s)
*.mainNode.app[0].bumpDroppedPriority = true

# ---- Map boundaries (used by mobility's constraintArea*) --------------
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMaxY = 1000m
**.constraintAreaMaxZ = 100m

# ---- Swarm population --------------------------------------------------
*.numMbs = 3
*.numDrones = 10

# ---- Mobility ----------------------------------------------------------
# Custom subclass of MovingMobilityBase that supports setTarget() and draws
# velocity vectors / trails in Qtenv. The main node never moves.
*.mainNode.mobility.typename = "uavswarmta.DroneMobility"

*.mbs[*].mobility.typename   = "uavswarmta.DroneMobility"
*.mbs[*].mobility.initialZ   = 0m

*.drone[*].mobility.typename = "uavswarmta.DroneMobility"
*.drone[*].mobility.initialZ = 50m

# How often Qtenv refreshes the moving icons (and our move() runs).
# Higher = fewer mobility events per simulated second -> faster Qtenv playback.
**.mobility.updateInterval = 1s
