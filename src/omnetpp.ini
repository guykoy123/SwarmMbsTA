[General]
# UAV swarm task allocation -- ideal in-range communication, custom mobility.
network = uavswarmta.SwarmNetwork

# ---- Apps installed in each host ---------------------------------------
*.mainNode.numApps = 1
*.mainNode.app[0].typename = "uavswarmta.MainNodeApp"

*.mbs[*].numApps = 1
*.mbs[*].app[0].typename = "uavswarmta.MbsApp"

*.drone[*].numApps = 1
*.drone[*].app[0].typename = "uavswarmta.DroneApp"

# ---- Reproducibility & batch ------------------------------------------
# Single run -- no `repeat = N` and no named configs below, so Qtenv skips
# its built-in run-selection dialog and goes straight to the simulation
# (which then optionally shows our own ask_user dialog).
seed-set = 0

# Visual feedback (canvas-only INET build)
*.visualizer.osgVisualizer.typename = ""

# Stop simulation eventually
sim-time-limit = 1000000s

# ---- App parameters ---------------------------------------------------
**.commTimeoutDuration = 10s
**.drone_comm_range = 250m
**.mbs_comm_range = 800m
*.drone[*].app[0].speed = 25mps
*.mbs[*].app[0].speed = 15mps

*.mainNode.app[0].algorithmType = "FIFO"
# Allocator variants:
#   FIFO          insertion-order queue, idle-only dispatch, no preemption
#   FIFO_PRIO     priority-ordered queue, idle-only dispatch, no preemption
#   FIFO_PREEMPT  priority-ordered queue + may preempt drones currently on a
#                 strictly lower-priority task when not enough idle drones exist
#   COST          full auction with cost-minimal drone + MBS pick (the COST
#                 tunables further down only apply to this variant)
*.mainNode.app[0].taskLimit = 10

# Inter-arrival time between generated tasks. Any OMNeT++ NED expression
# returning a simtime works; common choices (also offered in the ask_user
# dropdown):
#   uniform(10s, 30s)   - flat random in [10s, 30s]
#   normal(20s, 5s)     - Gaussian around 20s, sigma 5s (clamped to >=0)
#   exponential(15s)    - Poisson arrivals, mean 15s
#   2s                  - fixed/deterministic (bursty: constant rapid fire)
*.mainNode.app[0].taskGenerationInterval = uniform(10s, 30s)

*.mainNode.app[0].taskDuration = 30s
*.mainNode.app[0].bumpDroppedPriority = true

# ---- Task priority distribution ---------------------------------------
# priorityLevels = number of priority classes (1 = HIGH urgency, N = LOW).
# priorityWeights = space- or comma-separated weights, one per class in
# priority order (leftmost = priority 1). Empty string => uniform.
# The weights are normalised internally, so only the ratios matter.
#   ""           uniform (default; equivalent to intuniform(1, priorityLevels))
#   "5 2 1"      mostly high-pri  (pri1:pri2:pri3 = 5:2:1)
#   "1 2 5"      mostly low-pri
#   "1 3 1"      peaked on middle priority
*.mainNode.app[0].priorityLevels  = 3
*.mainNode.app[0].priorityWeights = ""
*.mainNode.app[0].taskDeadlineWeights = ""   # "" => no expiry; else N seconds per class, e.g. "10 30 120" (high stale fast, low patient)

# Per-task CSV output path. Supported placeholders (expanded at sim start):
#   {configname}  {runnumber}  {algorithm}
# Parent dirs are created if missing. Set to "" to disable CSV logging.
*.mainNode.app[0].csvOutputPath = "results/{configname}-run{runnumber}-{algorithm}-tasks.csv"

# Set ask_user=true to pop a modal dialog at sim start with one text field
# per tunable parameter (Qt form under Qtenv, semicolon-separated text prompt
# under Cmdenv). Edit any value, leave the rest, click OK to start the run.
# When false, the values from this ini are used as-is.
*.mainNode.app[0].ask_user = true

# ---- COST allocator tunables (only used when algorithmType == "COST") --
# To run the COST/auction algorithm from the paper instead of FIFO, flip
# algorithmType to "COST" above. The four weights below control the cost
# function (see MainNodeApp::computeDroneCost / computeMbsCost). Edit them
# here to tune the auction's behaviour without recompiling.
*.mainNode.app[0].costEnergyWeight        = 1.0     # per metre, drone->task
*.mainNode.app[0].costHaltPriorityWeight  = 100.0   # scalar fallback, used with linear ramp
*.mainNode.app[0].costHaltPriorityWeights = ""      # "" => use scalar; or e.g. "1000 100 10" for non-linear (must have priorityLevels entries)
*.mainNode.app[0].costHaltGroupSizeWeight = 10.0    # per drone in preempted group
*.mainNode.app[0].costMbsRelocationWeight = 1.0     # per metre, MBS shift

# ---- Map boundaries (used by mobility's constraintArea*) --------------
**.constraintAreaMinX = 0m
**.constraintAreaMinY = 0m
**.constraintAreaMinZ = 0m
**.constraintAreaMaxX = 1000m
**.constraintAreaMaxY = 1000m
**.constraintAreaMaxZ = 100m

# ---- Swarm population --------------------------------------------------
*.numMbs = 3
*.numDrones = 10

# ---- Mobility ----------------------------------------------------------
# Custom subclass of MovingMobilityBase that supports setTarget() and draws
# velocity vectors / trails in Qtenv. The main node never moves.
*.mainNode.mobility.typename = "uavswarmta.DroneMobility"

*.mbs[*].mobility.typename   = "uavswarmta.DroneMobility"
*.mbs[*].mobility.initialZ   = 0m

*.drone[*].mobility.typename = "uavswarmta.DroneMobility"
*.drone[*].mobility.initialZ = 50m

# How often Qtenv refreshes the moving icons (and our move() runs).
# Higher = fewer mobility events per simulated second -> faster Qtenv playback.
**.mobility.updateInterval = 1s

# Allocator selection happens at sim start via the ask_user dropdown
# (algorithmType field). To run from a script without the dialog, set
# ask_user = false above and change algorithmType in this ini.

